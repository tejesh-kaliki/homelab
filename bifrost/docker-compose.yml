services:
  bifrost:
    image: maximhq/bifrost:latest
    ports:
      - "39274:8080"
    restart: unless-stopped
    env_file:
        - .env
    environment:
      - LOG_LEVEL=info
      - GOGC=100
      - GOMEMLIMIT=500MiB
      - BIFROST_DB_TYPE=postgres
      - BIFROST_DB_DSN=postgres://bifrost:$BIFROST_DB_PASSWORD@postgres:5432/bifrost?sslmode=disable
    volumes:
      - ./data:/app/data
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 500M
    depends_on:
      - postgres
    networks:
      - proxy
      - default

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bifrost
      POSTGRES_PASSWORD: $BIFROST_DB_PASSWORD
      POSTGRES_DB: bifrost
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bifrost"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:

networks:
  proxy:
    name: homelab_proxy
    external: true
  default:
