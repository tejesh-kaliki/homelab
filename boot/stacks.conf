# Stacks that must not start until the external drive is mounted, in start
# order. A stack listed after another is only brought up once the earlier one
# is healthy (e.g. bifrost uses rustfs).
#
#   <stack dir>  [disk]      "disk" = also wait for $DISK to be mounted
DISK="/Volumes/Seagate 4TB"

rustfs  disk
bifrost
sonarr  disk
