services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    environment:
      APP_URL: https://monitoring.${BASE_DOMAIN}
    volumes:
      - beszel_data:/beszel_data
      - beszel_socket:/beszel_socket
    networks:
      - monitoring
      - homelab_proxy
    healthcheck:
      test: ['CMD', '/beszel', 'health', '--url', 'http://localhost:8090']
      interval: 120s
      start_period: 10s
      timeout: 5s

networks:
  monitoring:
    driver: bridge
  homelab_proxy:
    external: true

volumes:
  beszel_data:
  beszel_socket:
