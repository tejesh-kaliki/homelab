services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    labels:
      homelab.stack: media
      homelab.role: indexer
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - ./config/prowlarr:/config
    networks:
      - media
      - homelab_proxy

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    labels:
      homelab.stack: media
      homelab.role: series-manager
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - ./config/sonarr:/config
      - ${DATA_DIR:-./data}:/data
    networks:
      - media
      - homelab_proxy
    depends_on:
      - qbittorrent
      - prowlarr

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    labels:
      homelab.stack: media
      homelab.role: downloader
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - WEBUI_PORT=8080
    volumes:
      - ./config/qbittorrent:/config
      - ${DATA_DIR:-./data}:/data
      - ./download/incomplete:/download/incomplete
    ports:
      # torrent port — must stay exposed for seeding/downloading
      - 6881:6881
      - 6881:6881/udp
    networks:
      - media
      - homelab_proxy

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - 8096:8096
    labels:
      homelab.stack: media
      homelab.role: streaming
    environment:
      - TZ=Asia/Kolkata
    volumes:
      - ./config/jellyfin:/config
      - ${DATA_DIR:-./data}/media:/media
    networks:
      - media
      - homelab_proxy

networks:
  media:
    driver: bridge
  homelab_proxy:
    external: true
